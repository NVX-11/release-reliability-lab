name: Ephemeral staging deployment

on:
  workflow_dispatch:
    inputs:
      candidate_image:
        description: "Approved GHCR digest or full immutable reference"
        required: true
        type: string
      baseline_image:
        description: "Current healthy digest/reference (known Milestone 3 baseline by default)"
        required: true
        default: "ghcr.io/nvx-11/release-reliability-lab@sha256:1c3462d30f0d9e1c3fadfd2163ecae4828853e7c34f8a5bbf6cd9694acfda938"
        type: string
      fault_mode:
        description: "Optional controlled staging fault after verified promotion"
        required: true
        default: none
        type: choice
        options:
          - none
          - post_promotion_backend_failure
      availability_observer:
        description: "Independent stable-endpoint availability evidence"
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled

permissions:
  contents: read
  packages: read

jobs:
  stage-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      BASELINE_IMAGE: ${{ inputs.baseline_image }}
      CANDIDATE_IMAGE_INPUT: ${{ inputs.candidate_image }}
      FAULT_MODE: ${{ inputs.fault_mode }}
      AVAILABILITY_OBSERVER: ${{ inputs.availability_observer }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Safe interpolation values for independent diagnostics and cleanup. The
      # deployment process replaces these only after validating both inputs.
      ACTIVE_IMAGE: ghcr.io/nvx-11/release-reliability-lab@sha256:1c3462d30f0d9e1c3fadfd2163ecae4828853e7c34f8a5bbf6cd9694acfda938
      CANDIDATE_IMAGE: ghcr.io/nvx-11/release-reliability-lab@sha256:1c3462d30f0d9e1c3fadfd2163ecae4828853e7c34f8a5bbf6cd9694acfda938

    steps:
      - name: Check out deployment controller
        uses: actions/checkout@v4

      - name: Validate requested immutable identities
        run: |
          python staging/release_controller.py normalize "$BASELINE_IMAGE"
          python staging/release_controller.py normalize "$CANDIDATE_IMAGE_INPUT"

      - name: Pull, verify, stage, and promote published images
        env:
          INCIDENT_REPORT_PATH: ${{ runner.temp }}/release-reliability-incident.json
        run: bash staging/deploy.sh

      - name: Upload controlled-fault incident report
        if: always() && inputs.fault_mode == 'post_promotion_backend_failure'
        uses: actions/upload-artifact@v4
        with:
          name: controlled-fault-incident-${{ github.run_id }}
          path: ${{ runner.temp }}/release-reliability-incident.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload independent availability report
        if: always() && inputs.availability_observer == 'enabled'
        uses: actions/upload-artifact@v4
        with:
          name: availability-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/availability-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Show diagnostic container state on failure
        if: failure()
        run: |
          docker compose --project-name release-reliability-staging --file staging/compose.yml ps --all || true
          docker compose --project-name release-reliability-staging --file staging/compose.yml logs --no-color || true

      - name: Guarantee staging cleanup
        if: always()
        run: bash staging/cleanup.sh
